[package]
name = "cue-derive"
version = "0.1.0"
edition = "2024"
description = "Procedural derive macro for CUE schema validation in Rust"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
cue-eval = { path = "../cue-eval" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
