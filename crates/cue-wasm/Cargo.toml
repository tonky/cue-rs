[package]
name = "cue-wasm"
version = "0.1.0"
edition = "2024"
description = "WebAssembly bindings for CUE evaluation, validation, and formatting"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tonky/cue-rs"
readme = "README.md"
keywords = ["cue", "cuelang", "wasm", "webassembly", "validation"]
categories = ["wasm", "config"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cue-syntax = { path = "../cue-syntax" }
cue-eval = { path = "../cue-eval" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde-wasm-bindgen = "0.6"
