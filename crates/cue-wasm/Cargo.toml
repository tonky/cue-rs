[package]
name = "cue-wasm"
version = "0.1.0"
edition = "2024"
description = "WebAssembly bindings for CUE evaluation, validation, and formatting"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tonky/cue-rs"
readme = "README.md"
keywords = ["cue", "cuelang", "wasm", "webassembly", "validation"]
categories = ["wasm", "config"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cue-syntax = { workspace = true }
cue-eval = { workspace = true }
wasm-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
serde-wasm-bindgen = { workspace = true }
