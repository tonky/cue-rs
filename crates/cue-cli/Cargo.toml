[package]
name = "cue-cli"
version = "0.1.0"
edition = "2024"
description = "Command-line interface for the Rust CUE evaluator"

[[bin]]
name = "cue-rs"
path = "src/main.rs"

[dependencies]
cue-syntax = { path = "../cue-syntax" }
cue-eval = { path = "../cue-eval" }
cue-test-harness = { path = "../cue-test-harness" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde_json = "1.0"
serde_yaml = "0.9"
