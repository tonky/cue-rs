[package]
name = "cue-cli"
version = "0.1.0"
edition = "2024"
description = "Command-line interface and tool for the Rust CUE evaluator and validator"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tonky/cue-rs"
readme = "README.md"
keywords = ["cue", "cuelang", "cli", "validator", "evaluator"]
categories = ["command-line-utilities", "config"]

[[bin]]
name = "cue-rs"
path = "src/main.rs"

[dependencies]
cue-syntax = { workspace = true }
cue-eval = { workspace = true }
cue-test-harness = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
