[package]
name = "cue-eval"
version = "0.1.0"
edition = "2024"
description = "Arena-based lattice unification engine and evaluator for CUE with standard library packages"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tonky/cue-rs"
readme = "README.md"
keywords = ["cue", "cuelang", "evaluator", "unification", "lattice"]
categories = ["config", "data-structures"]

[dependencies]
cue-syntax = { workspace = true }
slotmap = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
regex = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }

[dev-dependencies]
cue-test-harness = { workspace = true }
tempfile = { workspace = true }
