[workspace]
members = [
    "crates/cue-syntax",
    "crates/cue-eval",
    "crates/cue-test-harness",
    "crates/cue-cli",
    "crates/cue-derive",
    "crates/cue-wasm",
]
resolver = "2"

[workspace.dependencies]
cue-syntax = { path = "crates/cue-syntax" }
cue-eval = { path = "crates/cue-eval" }
cue-test-harness = { path = "crates/cue-test-harness" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
slotmap = "1.0"
thiserror = "2.0"
regex = "1.11"
num-bigint = "0.4"
num-traits = "0.2"
tempfile = "3"
logos = "0.14"
insta = { version = "1.42", features = ["yaml"] }
walkdir = "2.5"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
